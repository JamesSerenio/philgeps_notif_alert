<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of

  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta name="theme-color" content="#0F4D2F">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>philgeps_notif_alert</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Syncfusion's web PDF viewer renders pages through PDF.js instead of
       relying on the browser's inconsistent inline PDF/iframe support. -->
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    window.pdfjsLib = pdfjsLib;
  </script>
  <!-- Re-save incremental PDFs entirely in the browser so Edge/File Manager
       sees the same final revision as the in-app viewer. This also preserves
       imported SLCC pages and vector table content without flattening. -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    window.normalizePdfBytes = async function (inputBytes) {
      if (!window.PDFLib) {
        throw new Error('PDF normalizer failed to load.');
      }
      const input = inputBytes instanceof Uint8Array
        ? inputBytes
        : new Uint8Array(inputBytes);
      const document = await window.PDFLib.PDFDocument.load(input, {
        ignoreEncryption: true,
        updateMetadata: false,
      });
      return document.save({
        useObjectStreams: false,
        addDefaultPage: false,
        objectsPerTick: 50,
      });
    };
  </script>
  <!--

    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
